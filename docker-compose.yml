name: coloring-tracker

services:
  init:
    image: busybox:1.36
    command: sh -c "mkdir -p /data && chown -R 1000:1000 /data"
    volumes:
      - ./data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    env_file: .env
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app-init:
    build: .
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py createsuperuserifneeded"
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend_webapp
    restart: unless-stopped
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend_webapp/node_modules
    environment:
      NODE_ENV: development
      VITE_HMR_PROTOCOL: wss
      VITE_HMR_PORT: 443
      VITE_HMR_PATH: hmr
      # Tunnelmole does not forward Vite WebSocket upgrades reliably. Keeping
      # HMR off prevents the Telegram WebApp from entering a reload loop.
      VITE_HMR_ENABLED: "false"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      VITE_DEV_MODE: "true"
      VITE_DEV_SERVER_HOST: frontend
      VITE_DEV_SERVER_PORT: "5173"
      VITE_HMR_ENABLED: "false"
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      app-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8022}:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/media:/srv/data/media:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
    command: celery -A coloring_tracker worker -l INFO
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
    command: celery -A coloring_tracker beat -l INFO --schedule=/app/data/celerybeat-schedule
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  tunnel:
    image: node:20-alpine
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
    # Keep the tunnel in its own network namespace. Restarting a container that
    # shares proxy's namespace can interrupt Caddy itself. tmole only accepts a
    # local port, so socat forwards its localhost:8000 to the proxy service.
    command: sh -c "npm install --global tunnelmole@latest && apk add --no-cache socat && (socat TCP-LISTEN:8000,fork,reuseaddr TCP:proxy:8000 &) && exec tmole 8000"
    depends_on:
      proxy:
        condition: service_started

  tunnel-monitor:
    build: .
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: python tunnel_monitor.py
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/data/tunnel_url.txt && grep -Eq 'https://[^/]+\\.(tunnelmole\\.net|trycloudflare\\.com)' /app/data/tunnel_url.txt"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      tunnel:
        condition: service_started

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python -m tracker_bot.main
    depends_on:
      web:
        condition: service_healthy
      tunnel-monitor:
        condition: service_healthy

volumes:
  pgdata:
    name: ${PG_VOLUME_NAME:-coloring_tracker_pgdata}
  frontend_node_modules:
