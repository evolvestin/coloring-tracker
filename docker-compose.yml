name: coloring-tracker

services:
  init:
    image: busybox:1.36
    command: sh -c "mkdir -p /data && chown -R 1000:1000 /data"
    volumes:
      - ./data:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    env_file: .env
    command: postgres -c max_connections=100 -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app-init:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./data:/app/data
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py createsuperuserifneeded"
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    working_dir: /app/frontend_webapp
    restart: unless-stopped
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - frontend_node_modules:/app/frontend_webapp/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: development

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      VITE_DEV_MODE: "true"
      VITE_DEV_SERVER_URL: http://localhost:5173
    volumes:
      - .:/app
      - ./data:/app/data
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-8022}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      app-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./data:/app/data
    command: celery -A coloring_tracker worker -l INFO
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./data:/app/data
    command: celery -A coloring_tracker beat -l INFO --schedule=/app/data/celerybeat-schedule
    depends_on:
      app-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m tracker_bot.main
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
    name: ${PG_VOLUME_NAME:-coloring_tracker_pgdata}
  frontend_node_modules:
